apiVersion: v1
kind: Service
metadata:
  name: control-plane
  namespace: minialaddin-distributed
spec:
  selector:
    app: control-plane
  ports:
    - port: 3100
      targetPort: 3100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: minialaddin-distributed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      containers:
        - name: control-plane
          image: minialaddin/control-plane:latest
          env:
            - name: NEXT_PUBLIC_CONTROL_API_URL
              value: http://control-api.minialaddin-distributed.svc.cluster.local:7900
          ports:
            - containerPort: 3100
          readinessProbe:
            httpGet:
              path: /
              port: 3100
          livenessProbe:
            httpGet:
              path: /
              port: 3100
