apiVersion: v1
kind: Service
metadata:
  name: coordinator-headless
  namespace: minialaddin-distributed
spec:
  clusterIP: None
  selector:
    com.minialaddin.distributed/role: coordinator
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: coordinator
  namespace: minialaddin-distributed
spec:
  serviceName: coordinator-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      com.minialaddin.distributed/role: coordinator
  template:
    metadata:
      labels:
        com.minialaddin.distributed/role: coordinator
    spec:
      containers:
        - name: coordinator
          image: minialaddin/distributed-service:latest
          env:
            - name: DISTRIBUTED_SERVICE_KIND
              value: coordinator
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: COORDINATOR_HEADLESS_SERVICE
              value: coordinator-headless
            - name: COORDINATOR_REPLICA_COUNT
              value: "3"
            - name: PORT
              value: "8000"
            - name: DISTRIBUTED_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: distributed-secrets
                  key: DISTRIBUTED_DATABASE_URL
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
