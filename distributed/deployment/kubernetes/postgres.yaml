apiVersion: v1
kind: Service
metadata:
  name: postgres-distributed
  namespace: minialaddin-distributed
spec:
  clusterIP: None
  selector:
    app: postgres-distributed
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-distributed
  namespace: minialaddin-distributed
spec:
  serviceName: postgres-distributed
  replicas: 1
  selector:
    matchLabels:
      app: postgres-distributed
  template:
    metadata:
      labels:
        app: postgres-distributed
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: omnisignal
            - name: POSTGRES_DB
              value: omnisignal_distributed
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: distributed-secrets
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "omnisignal", "-d", "omnisignal_distributed"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
